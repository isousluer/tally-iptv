name: Release

# Push a tag like v0.1.2 to build signed Android APKs and attach them to a
# draft release. Check the draft on GitHub, then press Publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches pubspec.yaml
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match version $VERSION in pubspec.yaml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the changelog has this version
        run: |
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. See RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mkdir dist
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app-$abi-release.apk" "../../../../dist/tally-$VERSION-$abi.apk"
          done
          cp app-release.apk "../../../../dist/tally-$VERSION-universal.apk"

      - name: Check the APKs carry the release key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | tee cert.txt
            if grep -q "CN=Android Debug" cert.txt; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done

      - name: Remove the signing key
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >> notes.md <<EOF

          ## Which file do I need?

          | File | For |
          | --- | --- |
          | \`tally-$VERSION-arm64-v8a.apk\` | Almost every phone and tablet from the last few years. **Start here.** |
          | \`tally-$VERSION-armeabi-v7a.apk\` | Older or low-cost phones and many Android TV boxes |
          | \`tally-$VERSION-x86_64.apk\` | Emulators and Intel/AMD Android devices |
          | \`tally-$VERSION-universal.apk\` | Works everywhere, but about three times larger |

          Installs over earlier versions and keeps your playlists, favorites and history.

          Full list of changes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          EOF
          gh release create "$TAG" dist/*.apk --draft --title "Tally $VERSION" --notes-file notes.md
