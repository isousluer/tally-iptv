org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Plugins live in the pub cache on another drive on Windows; Kotlin's
# incremental cache can't span drives, so compile non-incrementally.
kotlin.incremental=false

# Give every APK (per-ABI and universal) the same versionCode, so people can
# switch between them and always update. See versionCode in app/build.gradle.kts.
force-version-code-ignoring-abi=true
